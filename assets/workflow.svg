<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-labelledby="title desc">
    <title id="title">MacDiskLens</title><desc id="desc">Understand disk usage and see what the scan could not read.. Workflow diagram, not an application screenshot.</desc>
    <rect width="1200" height="492" fill="#f3f6f9"/>
    <rect width="1200" height="164" fill="#152b40"/>
    <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="52" font-size="14" font-weight="700" letter-spacing="3" fill="#a7bfd2">JIŘÍ DOLEŽAL / PROJECT SHOWCASE</text>
    <text x="48" y="103" font-size="34" font-weight="700" fill="white">MacDiskLens</text>
    <text x="48" y="137" font-size="17" fill="#c6d5e0">Understand disk usage and see what the scan could not read.</text>
    <rect x="48" y="210" width="260" height="190" rx="18" fill="#ffffff" stroke="#d9e1e8"/>
        <circle cx="80" cy="246" r="16" fill="#5968b2"/>
        <text x="80" y="252" text-anchor="middle" font-size="16" fill="white">1</text>
        <text x="72" y="297" font-size="22" font-weight="700" fill="#152b40">Choose a folder</text>
        <text x="72" y="334" font-size="16" fill="#4e6071">Select the scan scope</text>
        <text x="72" y="361" font-size="16" fill="#4e6071">and display depth.</text><path d="M 315 302 h 12 m -5 -5 l 5 5 l -5 5" fill="none" stroke="#5968b2" stroke-width="2"/><rect x="334" y="210" width="260" height="190" rx="18" fill="#ffffff" stroke="#d9e1e8"/>
        <circle cx="366" cy="246" r="16" fill="#5968b2"/>
        <text x="366" y="252" text-anchor="middle" font-size="16" fill="white">2</text>
        <text x="358" y="297" font-size="22" font-weight="700" fill="#152b40">Read disk usage</text>
        <text x="358" y="334" font-size="16" fill="#4e6071">Collect folder sizes</text>
        <text x="358" y="361" font-size="16" fill="#4e6071">without deleting data.</text><path d="M 601 302 h 12 m -5 -5 l 5 5 l -5 5" fill="none" stroke="#5968b2" stroke-width="2"/><rect x="620" y="210" width="260" height="190" rx="18" fill="#ffffff" stroke="#d9e1e8"/>
        <circle cx="652" cy="246" r="16" fill="#5968b2"/>
        <text x="652" y="252" text-anchor="middle" font-size="16" fill="white">3</text>
        <text x="644" y="297" font-size="22" font-weight="700" fill="#152b40">Explore the result</text>
        <text x="644" y="334" font-size="16" fill="#4e6071">Tree, table and treemap</text>
        <text x="644" y="361" font-size="16" fill="#4e6071">with explicit scan issues.</text><path d="M 887 302 h 12 m -5 -5 l 5 5 l -5 5" fill="none" stroke="#5968b2" stroke-width="2"/><rect x="906" y="210" width="260" height="190" rx="18" fill="#ffffff" stroke="#d9e1e8"/>
        <circle cx="938" cy="246" r="16" fill="#5968b2"/>
        <text x="938" y="252" text-anchor="middle" font-size="16" fill="white">4</text>
        <text x="930" y="297" font-size="22" font-weight="700" fill="#152b40">Export the report</text>
        <text x="930" y="334" font-size="16" fill="#4e6071">Save sizes and issues</text>
        <text x="930" y="361" font-size="16" fill="#4e6071">in a CSV report.</text>
    <text x="48" y="451" font-size="14" fill="#607387">WORKFLOW OVERVIEW · APPLICATION SOURCE CODE IS NOT INCLUDED</text>
    </g></svg>
